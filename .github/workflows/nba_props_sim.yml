name: Daily NBA Player Props & Game Simulation

on:
  schedule:
    - cron: '30 6 * * *'  # 12:30 AM CST (6:30 AM UTC)
    - cron: '30 16 * * *' # 10:30 AM CST (4:30 PM UTC) after morning injury reports
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-nba-props:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run NBA Games & Props Monte Carlo Engine (ESPN + Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: "https://rockodevxda.github.io/sports-command-center/"
        run: python nba_props_runner.py

      - name: Commit updated NBA games & props JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nba_props_slate.json nba_games_slate.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily NBA games & player props slates" && git pull --rebase && git push)
